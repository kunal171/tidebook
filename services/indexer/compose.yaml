name: tidebook-indexer

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: tidebook_indexer
      POSTGRES_USER: tidebook
      POSTGRES_PASSWORD: tidebook_dev
    ports:
      # Port 5432 is already used by the host PostgreSQL service. Bind the
      # development database only to localhost on the free port 5433.
      - "127.0.0.1:5433:5432"
    volumes:
      - tidebook_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tidebook -d tidebook_indexer"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  tidebook_postgres_data:
